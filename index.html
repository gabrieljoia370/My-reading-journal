<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>My Reading Journal</title><style>body{font-family:system-ui;margin:0;background:#f4efe5;color:#1f2c25}header{padding:24px;background:#294c3b;color:white}main{max-width:700px;margin:auto;padding:20px}.card{background:#fffaf1;border:1px solid #d9d0c2;border-radius:18px;padding:18px;margin:14px 0}input,textarea,select,button{box-sizing:border-box;width:100%;padding:12px;margin:6px 0;border-radius:12px;border:1px solid #ccc}button{background:#315b47;color:white;border:0;font-weight:700}.book{display:flex;gap:14px}.book img{width:90px;border-radius:8px}.muted{color:#68736c}.tabs{display:flex;gap:8px}.tabs button{width:auto}.entry{border-top:1px solid #ddd;padding-top:12px;margin-top:12px}</style><script src='https://accounts.google.com/gsi/client' async defer></script></head><body><header><h1>My Reading Journal</h1><div>Your books, thoughts & quotes.</div></header><main><section class='card'><h2>Find a book</h2><input id='q' placeholder='Title, author or ISBN'><button onclick='searchBooks()'>Search online</button><div id='results'></div></section><section class='card'><h2>My Library</h2><div id='library'></div></section><section class='card'><h2>New journal entry</h2><select id='bookSelect'></select><input id='page' placeholder='Page / chapter'><select id='mood'><option>🤔 Reflective</option><option>😍 Loving it</option><option>😮 Surprised</option><option>😢 Sad</option><option>😡 Frustrated</option></select><textarea id='thought' rows='5' placeholder='What are you thinking?'></textarea><textarea id='quote' rows='2' placeholder='Optional quote'></textarea><button onclick='saveEntry()'>Save entry</button><div id='entries'></div></section><section class='card'><h2>Google Drive</h2><p id='driveStatus' class='muted'>Not connected. Your journal is also saved locally on this device.</p><button id='driveBtn' onclick='connectDrive()'>Connect Google Drive</button><button id='syncBtn' onclick='syncDrive()' style='display:none'>Sync now</button></section></main><script>
const KEY='readingJournalV1';
const CLIENT_ID='687086093477-tsdiptjqsgjg2p140vfvqdokb0bjvd1k.apps.googleusercontent.com';
const DRIVE_SCOPE='https://www.googleapis.com/auth/drive.file';
let data=JSON.parse(localStorage.getItem(KEY)||'{"books":[],"entries":[]}');
let accessToken=null, driveFolderId=null, driveFileId=null, tokenClient=null;
function persist(){localStorage.setItem(KEY,JSON.stringify(data));render();if(accessToken)syncDrive(true)}
function setDriveStatus(msg){document.getElementById('driveStatus').textContent=msg}
function initTokenClient(){if(tokenClient||!window.google?.accounts?.oauth2)return;tokenClient=google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:DRIVE_SCOPE,callback:async r=>{if(r.error){setDriveStatus('Google Drive connection failed: '+r.error);return}accessToken=r.access_token;document.getElementById('driveBtn').textContent='Reconnect Google Drive';document.getElementById('syncBtn').style.display='block';setDriveStatus('Connected. Preparing My Reading Journal folder…');try{await prepareDrive();setDriveStatus('Connected to Google Drive. Your journal is synced.')}catch(e){console.error(e);setDriveStatus('Connected, but sync failed: '+e.message)}}})}
function connectDrive(){initTokenClient();if(!tokenClient){setDriveStatus('Google sign-in is still loading. Try again in a moment.');return}tokenClient.requestAccessToken({prompt:accessToken?'':'consent'})}
async function driveFetch(url,opts={}){opts.headers={...(opts.headers||{}),Authorization:'Bearer '+accessToken};let r=await fetch(url,opts);if(!r.ok)throw new Error((await r.text())||('HTTP '+r.status));return r}
async function prepareDrive(){let q=encodeURIComponent("name='My Reading Journal' and mimeType='application/vnd.google-apps.folder' and trashed=false");let j=await (await driveFetch('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id,name)&spaces=drive')).json();if(j.files?.length)driveFolderId=j.files[0].id;else{let r=await driveFetch('https://www.googleapis.com/drive/v3/files',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'My Reading Journal',mimeType:'application/vnd.google-apps.folder'})});driveFolderId=(await r.json()).id}
q=encodeURIComponent("name='reading-journal.json' and '"+driveFolderId+"' in parents and trashed=false");j=await (await driveFetch('https://www.googleapis.com/drive/v3/files?q='+q+'&fields=files(id,name)&spaces=drive')).json();if(j.files?.length){driveFileId=j.files[0].id;try{let remote=await (await driveFetch('https://www.googleapis.com/drive/v3/files/'+driveFileId+'?alt=media')).json();if(remote?.books&&remote?.entries&&data.books.length===0&&data.entries.length===0){data=remote;localStorage.setItem(KEY,JSON.stringify(data));render()}}catch(e){console.warn('Could not load remote journal',e)}}else{let boundary='journal_boundary';let meta=JSON.stringify({name:'reading-journal.json',parents:[driveFolderId],mimeType:'application/json'});let body='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+meta+'\r\n--'+boundary+'\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify(data)+'\r\n--'+boundary+'--';let r=await driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+boundary},body});driveFileId=(await r.json()).id}await syncDrive(true)}
async function syncDrive(silent=false){if(!accessToken){if(!silent)setDriveStatus('Connect Google Drive first.');return}if(!driveFileId){await prepareDrive();return}try{await driveFetch('https://www.googleapis.com/upload/drive/v3/files/'+driveFileId+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!silent)setDriveStatus('Synced with Google Drive just now.')}catch(e){setDriveStatus('Sync failed: '+e.message)}}
window.addEventListener('load',()=>setTimeout(initTokenClient,300));
async function searchBooks(){let q=document.getElementById('q').value.trim();if(!q)return;let r=await fetch('https://www.googleapis.com/books/v1/volumes?q='+encodeURIComponent(q)+'&maxResults=8');let j=await r.json();results.innerHTML=(j.items||[]).map((x,i)=>{let v=x.volumeInfo,im=v.imageLinks?.thumbnail||'';return `<div class='entry book'>${im?`<img src='${im.replace('http:','https:')}'>`:''}<div><b>${v.title||''}</b><div class='muted'>${(v.authors||[]).join(', ')}</div><div>${v.pageCount||'?'} pages · ${v.publishedDate||''}</div><button onclick='addBook(${JSON.stringify(JSON.stringify({id:x.id,title:v.title,authors:v.authors||[],cover:im,pages:v.pageCount||0,description:v.description||"",status:"Reading",progress:0})).replace(/'/g,"&#39;")})'>Add to library</button></div></div>`}).join('')}
function addBook(s){let b=JSON.parse(s);if(!data.books.some(x=>x.id===b.id))data.books.push(b);persist()}
function saveEntry(){let id=bookSelect.value;if(!id)return alert('Add a book first.');data.entries.unshift({id:Date.now(),bookId:id,date:new Date().toISOString(),page:page.value,mood:mood.value,thought:thought.value,quote:quote.value});thought.value='';quote.value='';page.value='';persist()}
function render(){library.innerHTML=data.books.length?data.books.map(b=>`<div class='entry book'>${b.cover?`<img src='${b.cover.replace('http:','https:')}'>`:''}<div><b>${b.title}</b><div class='muted'>${b.authors.join(', ')}</div><div>${b.status} · ${b.progress||0}/${b.pages||'?'} pages</div></div></div>`).join(''):'<p class="muted">Your library is empty.</p>';bookSelect.innerHTML=data.books.map(b=>`<option value='${b.id}'>${b.title}</option>`).join('');entries.innerHTML=data.entries.map(e=>{let b=data.books.find(x=>x.id===e.bookId);return `<div class='entry'><b>${b?.title||'Book'}</b> · ${e.mood}<div class='muted'>${new Date(e.date).toLocaleDateString()} · ${e.page}</div><p>${e.thought}</p>${e.quote?`<blockquote>“${e.quote}”</blockquote>`:''}</div>`}).join('')}
render();</script></body></html>
